# fly.io config for luauwhitelist
# Документация: https://fly.io/docs/
app = "luauwhitelist"
primary_region = "waw"   # поменяй на ближайший: fra, waw, ams, iad, sin ...

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  TRIAL_DAYS = "7"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "luauwhitelist_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[checks]]
  port = 8080
  type = "http"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
